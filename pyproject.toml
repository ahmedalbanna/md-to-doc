[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-docx"
version = "1.0.0"
description = "Markdown to DOCX converter with full RTL/LTR support, Arabic/English fonts, and high-precision formatting"
authors = [{name = "md-to-docx", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["markdown", "docx", "converter", "arabic", "rtl", "plantuml", "mermaid"]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "click>=8.1.0",
    "python-multipart>=0.0.6",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
]

[project.scripts]
md-to-docx = "md_to_docx.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.25.0"]

[tool.setuptools.packages.find]
include = ["md_to_docx*"]